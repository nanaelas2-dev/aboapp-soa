# log4j AboApp
log4j.rootCategory=INFO, CONSOLE, FICHIER

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%-5p %d{HH:mm:ss} %c{1} : %m%n

log4j.appender.FICHIER=org.apache.log4j.RollingFileAppender
log4j.appender.FICHIER.File=logs/aboapp.log
log4j.appender.FICHIER.MaxFileSize=5MB
log4j.appender.FICHIER.MaxBackupIndex=3
log4j.appender.FICHIER.layout=org.apache.log4j.PatternLayout
log4j.appender.FICHIER.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n

log4j.logger.ma.telecomatlas=DEBUG
log4j.logger.ma.telecomatlas.abo.facturation=DEBUG, FICHIER
log4j.logger.org.apache.cxf=INFO
log4j.logger.org.springframework=WARN
#log4j.logger.org.springframework.jdbc=DEBUG
